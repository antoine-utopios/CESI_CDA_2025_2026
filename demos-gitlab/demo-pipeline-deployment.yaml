workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - package
  - deploy
  
variables:
  CONTAINER_NAME: demo-deploy

default:
  tags:
    - docker
    - local

job-all-branches:
  image: alpine
  stage: test
  script:
    - echo "Je suis un job de branche de dev ou autre... n'étant pas la branche principale"
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

.common: 
  tags:
    - docker
    - local

.job-main:
  extends:
    - .common
  image: alpine
  stage: test
  script:
    - echo "Je suis un job de branche principale"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

packaging-image:
  image: docker
  services:
    - docker:dind
  stage: package
  before_script: 
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE:latest .
    - docker push -a $CI_REGISTRY_IMAGE
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deploy-app:
  image: alpine
  stage: deploy
  before_script: 
    - apk add openssh
    - mkdir -p ~/.ssh/
    - echo $VM_PRIVATE_KEY_B64 | base64 -d >> ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - echo $VM_KNOWN_HOSTS_B64 | base64 -d >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh -i ~/.ssh/id_rsa $VM_USER@$VM_HOST "echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY && docker pull $CI_REGISTRY_IMAGE:latest && docker stop $CONTAINER_NAME || true && docker rm $CONTAINER_NAME || true && docker run --name $CONTAINER_NAME -p 80:80 -d $CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH