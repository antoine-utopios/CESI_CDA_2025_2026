workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

default: 
  tags:
    - docker
    - local

variables:
  CURRENT_DATE: $(date)
    
dependencies-vuln-check:
  stage: verif-dep
  image: 
    name: aquasec/trivy
    entrypoint: [""]
  script:
    - trivy fs \ 
      --severity HIGH, CRITICAL \
      -f json \
      -o $CURRENT_DATE-dependencies-vulneralities.json \
      .
  artifacts:
    paths:
      - $CURRENT_DATE-dependencies-vulneralities.json
