workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    
default:
  tags:
    - docker
    - local

job-all-branches:
  image: alpine
  stage: test
  script:
    - echo "Je suis un job de branche de dev ou autre... n'étant pas la branche principale"
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

job-main:
  image: alpine
  stage: test
  script:
    - echo "Je suis un job de branche principale"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH